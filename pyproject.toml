[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medaxis"
version = "0.1.0"
description = "Medical Imaging Rendering & Segmentation Platform"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "MedAxis Team"}]
keywords = ["medical-imaging", "dicom", "segmentation", "visualization", "mpr"]

dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    # 与 C++ 原生层 (conda-forge vtk 9.6.2) 对齐, 避免同一进程内两套 VTK ABI
    "vtk==9.6.2",
    # 与 C++ 原生层 (源码构建 ITK 5.4.7) 对齐
    "itk==5.4.7",
    "pydicom>=2.4",
    "nibabel>=5.2",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pynrrd>=1.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "grpcio>=1.62",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "python-dateutil>=2.8",
    "orjson>=3.9",
]

[project.optional-dependencies]
# 注意: gdcm / pythonocc-core 在 PyPI 没有 Windows 轮子,
# Windows 上请通过 conda-forge 安装 (见 README "Native build")。
docs = ["sphinx>=7.2", "myst-parser>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.6",
    "ruff>=0.3",
    "pybind11>=2.11",  # 构建 native C++ 扩展所需的 CMake 配置
]

[project.scripts]
medaxis = "app.main:main"

[project.entry-points."medaxis.plugins"]
readers = "plugins.builtin.readers"
algorithms = "processing.segmentation"
ai_clients = "plugins.api_clients"

[tool.setuptools.packages.find]
include = ["app*", "ui*", "core*", "io*", "medaxis_io*", "rendering*", "processing*", "geometry*", "mcp*", "plugins*", "scripts*", "ai_inference*", "utils*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.uv]
package = true
python-preference = "managed"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
