# MedAxis CI — quick quality gates for development branches and pull requests.
#
# The full native compile + packaging pipeline runs on `main` only
# (see release.yml). This workflow keeps dev branches fast: lint, unit tests
# and a lightweight CMake configure check (no native build).
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync  # dev group (pytest/ruff/pybind11) is installed by default

      - name: Lint
        run: uv run ruff check app core geometry io medaxis_io mcp plugins processing rendering scripts ui tests

      - name: Unit tests
        run: uv run pytest -q

      - name: Byte-compile check
        run: uv run python -m compileall -q app core geometry io medaxis_io mcp plugins processing rendering scripts ui utils ai_inference

      - name: CMake configure check (native off)
        run: |
          cmake -S . -B build-check -DMEDAXIS_BUILD_NATIVE=OFF
          cmake --build build-check --config Release
